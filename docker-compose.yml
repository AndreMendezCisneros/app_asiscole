services:
  postgres:
    image: postgres:16-alpine
    container_name: asiscole_postgres
    environment:
      POSTGRES_DB: ${CENTRAL_DB_NAME:-asiscole_central}
      POSTGRES_USER: ${CENTRAL_DB_USER:-asiscole}
      POSTGRES_PASSWORD: ${CENTRAL_DB_PASSWORD:-asiscole}
      TZ: America/Lima
    ports:
      - "${CENTRAL_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CENTRAL_DB_USER:-asiscole}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: asiscole_redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: asiscole_backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      CENTRAL_DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    container_name: asiscole_worker
    command: celery -A config worker -l info
    env_file: .env
    environment:
      CENTRAL_DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - backend

  beat:
    build: ./backend
    container_name: asiscole_beat
    command: celery -A config beat -l info
    env_file: .env
    environment:
      CENTRAL_DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
